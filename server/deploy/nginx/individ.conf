# /etc/nginx/sites-available/individ.conf
# Serves the Flutter web build and proxies /api to the app on 127.0.0.1:8000.
# Replace individ.uz with your domain. Certificates: certbot --nginx -d individ.uz

limit_req_zone $binary_remote_addr zone=individ_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=individ_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=individ_conn:10m;
server_tokens off;

# HTTP -> HTTPS (and nothing else)
server {
    listen 80;
    listen [::]:80;
    server_name individ.uz www.individ.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://individ.uz$request_uri; }
}

# Unknown host names get nothing (stops host-header tricks and IP scanning)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name individ.uz;

    ssl_certificate     /etc/letsencrypt/live/individ.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/individ.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /srv/individ/web;   # contents of build/web
    index index.html;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn individ_conn 30;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Enforced CSP for the Flutter app. Build with --no-web-resources-cdn so
    # CanvasKit is served from this server instead of gstatic.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Never serve hidden files, backups, env files, source maps or databases.
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|bak|backup|sql|sqlite|db|log|map|ini|py|sh|yaml|yml|lock)$ { deny all; return 404; }

    location = /api/auth/login                 { limit_req zone=individ_auth burst=5 nodelay; include /etc/nginx/individ_proxy.conf; }
    location = /api/auth/mfa/verify            { limit_req zone=individ_auth burst=5 nodelay; include /etc/nginx/individ_proxy.conf; }
    location ^~ /api/auth/password/            { limit_req zone=individ_auth burst=5 nodelay; include /etc/nginx/individ_proxy.conf; }
    location /api/                             { limit_req zone=individ_api burst=40 nodelay; include /etc/nginx/individ_proxy.conf; }

    location / {
        try_files $uri $uri/ /index.html;
        location ~* \.(js|wasm|png|ico|json|otf|ttf)$ { expires 7d; add_header Cache-Control "public"; }
    }
}
