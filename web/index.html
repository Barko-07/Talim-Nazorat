<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Ilova ichidagi manzillar boshqa saytlarga yuborilmaydi -->
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Individ — Alohida Ta’lim Ehtiyojlari Bo‘lgan Bolalar Rivojlanish Monitoringi Platformasi">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Individ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Individ — Alohida Ta’lim Ehtiyojlari Bo‘lgan Bolalar Rivojlanish Monitoringi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #121314;
      }
    }
  </style>
  <script src="sw_cleanup.js"></script>
  <style>
    /* Ilova kodi yuklanguncha: ochilish animatsiyasining (lib/screens/entry/
       intro_screen.dart) birinchi kadri bilan bir xil rangli bo'sh ekran -
       oq sahifa yoki alohida yuklanish ekrani yo'q, animatsiya shu fonda
       boshlanadi. splash.js ilova chizilgach uni olib tashlaydi. */
    #app-splash { position: fixed; inset: 0; z-index: 9999; background: #ffffff;
      display: flex; align-items: flex-end; justify-content: center; }
    /* Faqat internet juda sekin bo'lsa (6 s dan keyin) - ingichka chiziq */
    #app-splash .bar { margin-bottom: 18vh; width: 96px; height: 3px; border-radius: 3px;
      background: #e3ebf6; overflow: hidden; opacity: 0; animation: s-fade .4s 6s ease both; }
    #app-splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      border-radius: 3px; background: #0078EC; animation: s-bar 1.1s ease-in-out infinite; }
    @keyframes s-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes s-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-color-scheme: dark) {
      #app-splash { background: #121314; }
      #app-splash .bar { background: #303236; }
      #app-splash .bar::after { background: #7DB8FF; }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Individ yuklanmoqda">
    <div class="bar"></div>
  </div>
  <script src="splash.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=20261102_1315" async></script>
</body>
</html>
