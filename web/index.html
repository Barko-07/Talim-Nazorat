<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Ilova ichidagi manzillar boshqa saytlarga yuborilmaydi -->
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Individ — Alohida Ta’lim Ehtiyojlari Bo‘lgan Bolalar Rivojlanish Monitoringi Platformasi">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Individ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Individ — Alohida Ta’lim Ehtiyojlari Bo‘lgan Bolalar Rivojlanish Monitoringi</title>
  <link rel="manifest" href="manifest.json">
  <script src="sw_cleanup.js"></script>
  <style>
    /* Yuklanish ekrani: ilova kodi (bir necha MB) yuklanguncha oq ekran
       turmasin. Flutter birinchi kadrni chizganda splash.js uni olib tashlaydi. */
    #app-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e8f1fd 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease; }
    #app-splash.hide { opacity: 0; pointer-events: none; }
    #app-splash img { width: 104px; height: 104px; animation: splash-in .6s ease-out both; }
    #app-splash .word { font-size: 34px; font-weight: 700; letter-spacing: -.5px; color: #001945;
      animation: splash-in .6s .15s ease-out both; }
    #app-splash .word b { color: #3DBE37; font-weight: 700; }
    #app-splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #d6e4f7; overflow: hidden; }
    #app-splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #0078EC; animation: splash-bar 1.1s ease-in-out infinite; }
    @keyframes splash-in { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
    @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-color-scheme: dark) {
      #app-splash { background: #121314; }
      #app-splash .word { color: #f2f4f7; }
      #app-splash .bar { background: #303236; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash img, #app-splash .word, #app-splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Individ yuklanmoqda">
    <img src="icons/Icon-192.png" alt="">
    <div class="word">Ind<b>i</b>v<b>i</b>d</div>
    <div class="bar"></div>
  </div>
  <script src="splash.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=20261102_1315" async></script>
</body>
</html>
